<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국어 발음 듣기 퀴즈 | 한국문화원 전화 연습</title>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --background: #f1f5f9;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --success: #166534;
      --success-bg: #dcfce7;
      --error: #9a3412;
      --error-bg: #ffedd5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family:
        "Noto Sans KR", "Malgun Gothic",
        "Apple SD Gothic Neo", sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.7;
      word-break: keep-all;
    }

    .container {
      max-width: 720px;
      margin: 25px auto;
      padding: 32px;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .subtitle {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 14px;
      font-weight: bold;
    }

    h1 {
      font-size: 28px;
      margin: 15px 0 8px;
      line-height: 1.4;
    }

    h2 {
      font-size: 23px;
      line-height: 1.5;
    }

    p {
      font-size: 17px;
    }

    .description {
      color: var(--muted);
      font-size: 16px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: bold;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .question-number {
      color: var(--primary);
      font-weight: bold;
      font-size: 16px;
    }

    .question-text {
      margin: 10px 0 24px;
      font-size: 22px;
      font-weight: bold;
    }

    .situation {
      padding: 20px;
      margin: 15px 0 25px;
      background: #eff6ff;
      border-left: 5px solid var(--primary);
      border-radius: 8px;
      font-size: 19px;
    }

    .audio-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0 28px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
      touch-action: manipulation;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 3px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .audio-button {
      flex: 1;
      min-width: 135px;
      padding: 15px 18px;
      color: white;
      background: var(--primary);
    }

    .audio-button:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .replay-button {
      background: #475569;
    }

    .replay-button:hover:not(:disabled) {
      background: #334155;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 20px;
    }

    .choice-button {
      width: 100%;
      min-height: 70px;
      padding: 16px 20px;
      background: white;
      color: var(--text);
      border: 2px solid var(--border);
      text-align: center;
      font-size: 22px;
    }

    .choice-button:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .choice-button.correct {
      border-color: #16a34a;
      background: var(--success-bg);
      color: var(--success);
    }

    .choice-button.incorrect {
      border-color: #ea580c;
      background: var(--error-bg);
      color: var(--error);
    }

    .feedback {
      display: none;
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      font-size: 17px;
    }

    .feedback.visible {
      display: block;
    }

    .feedback.success {
      background: var(--success-bg);
      color: var(--success);
    }

    .feedback.error {
      background: var(--error-bg);
      color: var(--error);
    }

    .feedback p {
      margin: 8px 0;
    }

    .feedback strong {
      font-size: 19px;
    }

    .feedback .hint {
      padding-top: 10px;
      margin-top: 12px;
      border-top: 1px solid rgba(0, 0, 0, 0.12);
    }

    .next-button,
    .restart-button {
      display: none;
      width: 100%;
      padding: 18px;
      margin-top: 25px;
      color: white;
      background: var(--primary);
      font-size: 20px;
    }

    .next-button:hover,
    .restart-button:hover {
      background: var(--primary-dark);
    }

    .result {
      display: none;
      text-align: center;
    }

    .score {
      font-size: 54px;
      font-weight: bold;
      color: var(--primary);
      margin: 20px 0;
    }

    .result-summary {
      margin-top: 30px;
      padding: 22px;
      background: #f8fafc;
      border-radius: 12px;
      text-align: left;
    }

    .result-summary h3 {
      margin-top: 0;
      font-size: 20px;
    }

    .sound-result {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 17px;
    }

    .sound-result:last-child {
      border-bottom: none;
    }

    .mistake-count {
      color: #c2410c;
      font-weight: bold;
    }

    .small-note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    footer {
      margin-top: 32px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        margin: 8px auto;
        padding: 22px 18px;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 21px;
      }

      .question-text {
        font-size: 20px;
      }

      .choice-button {
        min-height: 68px;
        font-size: 21px;
      }

      .audio-button {
        font-size: 16px;
      }

      .score {
        font-size: 46px;
      }
    }
  </style>
</head>

<body>

<main class="container">

  <header>
    <span class="subtitle">TOPIK 2~3급 · 한국어 듣기</span>
    <h1>한국어 발음 듣기 퀴즈</h1>
    <p class="description">
      한국문화원에 전화할 때 필요한 듣기 연습
    </p>
    <p class="description">
      비슷한 소리를 듣고 알맞은 답을 골라 보세요.
    </p>
  </header>

  <section id="quizScreen">

    <div class="progress-info">
      <span id="progressText">문제 1 / 5</span>
      <span id="scoreText">현재 점수: 0점</span>
    </div>

    <div
      class="progress-track"
      role="progressbar"
      aria-label="퀴즈 진행률"
      aria-valuemin="0"
      aria-valuemax="5"
      aria-valuenow="0"
      id="progressTrack"
    >
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="question-number" id="questionNumber">
      문제 1
    </div>

    <h2 class="question-text" id="questionText"></h2>

    <div
      id="situationBox"
      class="situation"
      hidden
    ></div>

    <div
      class="audio-controls"
      id="audioControls"
    >
      <button
        type="button"
        class="audio-button"
        id="listenButton"
      >
        🔊 소리 듣기
      </button>

      <button
        type="button"
        class="audio-button replay-button"
        id="replayButton"
      >
        🔁 다시 듣기
      </button>
    </div>

    <div
      class="choices"
      id="choices"
      role="group"
      aria-label="정답 선택"
    ></div>

    <div
      class="feedback"
      id="feedback"
      role="status"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <button
      type="button"
      class="next-button"
      id="nextButton"
    >
      다음 문제 →
    </button>

  </section>

  <section
    class="result"
    id="resultScreen"
    aria-labelledby="resultTitle"
  >
    <h2 id="resultTitle">🎉 연습이 끝났어요!</h2>

    <p>잘했어요! 나의 점수를 확인해 보세요.</p>

    <div class="score" id="finalScore"></div>

    <p id="resultMessage"></p>

    <div class="result-summary">
      <h3>📊 나의 발음 듣기 결과</h3>

      <p>
        어떤 소리를 더 연습하면 좋을까요?
      </p>

      <div id="soundSummary"></div>

      <p
        class="small-note"
        id="summaryNote"
      ></p>
    </div>

    <button
      type="button"
      class="restart-button"
      id="restartButton"
    >
      🔄 다시 하기
    </button>
  </section>

  <footer>
    한국어 발음 구별 연습 · 평음 / 격음 / 경음
    <br>
    첫 번째 선택을 기준으로 점수를 계산합니다.
  </footer>

</main>

<script>
"use strict";

/* ========================================
   1. 퀴즈 데이터
======================================== */

const questions = [
  {
    id: 1,
    type: "audio",
    text: "소리를 듣고 알맞은 단어를 고르세요.",
    audio: "audio/q1_ppul.mp3",
    choices: ["불", "뿔", "풀"],
    answer: "뿔",
    soundType: "경음",
    soundHint: "경음은 짧고 단단하게 소리 내요.",
    mouthHint:
      "입 모양: 두 입술을 단단히 닫았다가 짧게 열어요."
  },

  {
    id: 2,
    type: "audio",
    text: "소리를 듣고 알맞은 단어를 고르세요.",
    audio: "audio/q2_ja.mp3",
    choices: ["자다", "짜다", "차다"],
    answer: "자다",
    soundType: "평음",
    soundHint:
      "평음은 숨이 약하고 뒤 모음이 낮게 시작해요.",
    mouthHint:
      "혀 위치: 혀 앞부분을 윗잇몸 가까이에 두고 부드럽게 소리 내요."
  },

  {
    id: 3,
    type: "audio",
    text: "소리를 듣고 알맞은 단어를 고르세요.",
    audio: "audio/q3_tal.mp3",
    choices: ["달", "딸", "탈"],
    answer: "탈",
    soundType: "격음",
    soundHint: "격음은 숨이 세게 나오는 소리예요.",
    mouthHint:
      "혀 위치: 혀끝을 윗잇몸에 댔다가 떼면서 숨을 세게 내쉬어요."
  },

  {
    id: 4,
    type: "audio",
    text: "문장에서 들은 단어를 고르세요.",
    audio: "audio/q4_sentence.mp3",
    choices: ["달", "딸", "탈"],
    answer: "딸",
    soundType: "경음",
    soundHint:
      "경음은 짧고 단단하게 소리 내요.",
    mouthHint:
      "혀 위치: 혀끝을 윗잇몸에 단단히 붙였다가 짧게 떼요."
  },

  {
    id: 5,
    type: "text",
    text: "이럴 때 어떤 말을 하면 좋을까요?",
    situation:
      "인턴십 문의 전화에서 상대방 말이 잘 안 들렸어요.",
    choices: [
      "다시 한번 말씀해 주시겠어요?",
      "다시 한번 보여 주시겠어요?",
      "조금 더 빨리 말씀해 주시겠어요?"
    ],
    answer: "다시 한번 말씀해 주시겠어요?",
    soundType: null,
    textHint:
      "전화에서는 상대방에게 다시 말해 달라고 정중하게 부탁해요."
  }
];


/* ========================================
   2. 상태 변수
======================================== */

let currentQuestion = 0;
let score = 0;
let locked = false;
let currentAudio = null;
let currentChoices = [];

const missedQuestions = new Set();

let soundMistakes = {
  "평음": 0,
  "격음": 0,
  "경음": 0
};

let feedbackToken = 0;


/* ========================================
   3. HTML 요소
======================================== */

const quizScreen =
  document.getElementById("quizScreen");

const resultScreen =
  document.getElementById("resultScreen");

const progressText =
  document.getElementById("progressText");

const scoreText =
  document.getElementById("scoreText");

const progressFill =
  document.getElementById("progressFill");

const progressTrack =
  document.getElementById("progressTrack");

const questionNumber =
  document.getElementById("questionNumber");

const questionText =
  document.getElementById("questionText");

const situationBox =
  document.getElementById("situationBox");

const audioControls =
  document.getElementById("audioControls");

const listenButton =
  document.getElementById("listenButton");

const replayButton =
  document.getElementById("replayButton");

const choicesContainer =
  document.getElementById("choices");

const feedback =
  document.getElementById("feedback");

const nextButton =
  document.getElementById("nextButton");

const restartButton =
  document.getElementById("restartButton");


/* ========================================
   4. 오디오 관리
======================================== */

function stopAudio() {
  if (currentAudio) {
    currentAudio.pause();

    try {
      currentAudio.currentTime = 0;
    } catch (error) {
      // 아직 로드되지 않은 오디오일 수 있습니다.
    }

    currentAudio = null;
  }
}

/*
  파일에 들어 있는 실제 음성을 재생합니다.
  rate = 1    : 원래 속도
  rate = 0.75 : 천천히 듣기
*/

function playAudio(rate = 1) {
  const question = questions[currentQuestion];

  if (!question.audio) {
    return Promise.resolve(false);
  }

  stopAudio();

  const audio = new Audio(question.audio);

  currentAudio = audio;
  audio.preload = "auto";
  audio.playbackRate = rate;
  audio.volume = 1;

  if ("preservesPitch" in audio) {
    audio.preservesPitch = true;
  }

  return new Promise((resolve) => {
    let finished = false;

    function finish(success) {
      if (finished) return;

      finished = true;

      if (currentAudio === audio) {
        currentAudio = null;
      }

      resolve(success);
    }

    audio.addEventListener(
      "ended",
      () => finish(true),
      { once: true }
    );

    audio.addEventListener(
      "error",
      () => finish(false),
      { once: true }
    );

    const playPromise = audio.play();

    if (playPromise) {
      playPromise.catch(() => finish(false));
    }
  });
}

function listenToAudio() {
  if (locked) return;

  const questionIndex = currentQuestion;

  playAudio(1).then((success) => {
    if (
      !success &&
      questionIndex === currentQuestion &&
      !locked
    ) {
      showAudioError();
    }
  });
}

function showAudioError() {
  feedback.className = "feedback visible error";
  feedback.replaceChildren();

  addFeedbackLine(
    "소리 파일을 재생할 수 없어요. " +
    "audio 폴더와 파일 이름을 확인해 주세요."
  );
}


/* ========================================
   5. 화면 표시
======================================== */

function showQuestion() {
  feedbackToken++;
  stopAudio();

  locked = false;

  const question = questions[currentQuestion];

  currentChoices = [...question.choices];

  questionNumber.textContent =
    `문제 ${currentQuestion + 1}`;

  progressText.textContent =
    `문제 ${currentQuestion + 1} / ${questions.length}`;

  scoreText.textContent =
    `현재 점수: ${score}점`;

  progressFill.style.width =
    `${(currentQuestion / questions.length) * 100}%`;

  progressTrack.setAttribute(
    "aria-valuenow",
    currentQuestion
  );

  questionText.textContent = question.text;

  feedback.className = "feedback";
  feedback.replaceChildren();

  nextButton.style.display = "none";

  if (question.type === "audio") {
    audioControls.hidden = false;
    situationBox.hidden = true;
  } else {
    audioControls.hidden = true;
    situationBox.hidden = false;
    situationBox.textContent = question.situation;
  }

  setControlsDisabled(false);
  renderChoices();

  questionNumber.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}


/* ========================================
   6. 보기 생성
======================================== */

function renderChoices() {
  choicesContainer.replaceChildren();

  currentChoices.forEach((choice, index) => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "choice-button";

    button.textContent =
      `${index + 1}. ${choice}`;

    button.disabled = locked;

    button.addEventListener("click", () => {
      checkAnswer(choice, button);
    });

    choicesContainer.appendChild(button);
  });
}

function setControlsDisabled(disabled) {
  listenButton.disabled = disabled;
  replayButton.disabled = disabled;

  const buttons =
    choicesContainer.querySelectorAll("button");

  buttons.forEach((button) => {
    button.disabled = disabled;
  });
}


/* ========================================
   7. 피드백 표시
======================================== */

function addFeedbackLine(text, className = "") {
  const paragraph = document.createElement("p");

  paragraph.textContent = text;

  if (className) {
    paragraph.className = className;
  }

  feedback.appendChild(paragraph);
}

function wait(milliseconds) {
  return new Promise((resolve) => {
    setTimeout(resolve, milliseconds);
  });
}

/*
  보기를 이전과 다른 순서로 바꿉니다.
  3개의 보기를 한 칸씩 이동합니다.
*/

function reorderChoices() {
  if (currentChoices.length > 1) {
    const firstChoice = currentChoices.shift();
    currentChoices.push(firstChoice);
  }
}


/* ========================================
   8. 정답 확인
======================================== */

function checkAnswer(selected, selectedButton) {
  if (locked) return;

  const question = questions[currentQuestion];

  if (selected === question.answer) {
    handleCorrectAnswer(selectedButton);
  } else {
    handleWrongAnswer(selectedButton);
  }
}


/* ========================================
   9. 정답 처리
======================================== */

function handleCorrectAnswer(selectedButton) {
  locked = true;

  stopAudio();
  setControlsDisabled(true);

  const question = questions[currentQuestion];

  /*
    첫 번째 선택에서 맞힌 경우만 점수를 줍니다.
    틀린 뒤 다시 맞히면 학습은 완료되지만
    점수는 올라가지 않습니다.
  */

  if (!missedQuestions.has(currentQuestion)) {
    score++;
  }

  selectedButton.classList.add("correct");

  scoreText.textContent =
    `현재 점수: ${score}점`;

  feedback.className = "feedback visible success";
  feedback.replaceChildren();

  addFeedbackLine(
    `✅ 정답이에요! "${question.answer}"`
  );

  if (question.soundType) {
    addFeedbackLine(
      `이 소리는 ${question.soundType}이에요.`
    );
  } else {
    addFeedbackLine(
      "상대방에게 다시 말해 달라고 정중하게 부탁하는 표현이에요."
    );
  }

  if (currentQuestion === questions.length - 1) {
    nextButton.textContent = "결과 보기 →";
  } else {
    nextButton.textContent = "다음 문제 →";
  }

  nextButton.style.display = "block";
}


/* ========================================
   10. 오답 처리
======================================== */

async function handleWrongAnswer(selectedButton) {
  locked = true;

  const questionIndex = currentQuestion;
  const question = questions[questionIndex];

  const token = ++feedbackToken;

  stopAudio();
  setControlsDisabled(true);

  selectedButton.classList.add("incorrect");

  /*
    한 문항에서 여러 번 틀려도
    소리 유형별 오류는 한 번만 기록합니다.
  */

  if (!missedQuestions.has(questionIndex)) {
    missedQuestions.add(questionIndex);

    if (question.soundType) {
      soundMistakes[question.soundType]++;
    }
  }

  feedback.className = "feedback visible error";
  feedback.replaceChildren();

  if (question.type === "audio") {

    /*
      1단계
      천천히 같은 음성 듣기
    */

    addFeedbackLine("❌ 아쉬워요!");
    addFeedbackLine(
      "① 천천히 다시 들어 보세요. (0.75배속)"
    );

    const success = await playAudio(0.75);

    if (token !== feedbackToken) return;

    if (!success) {
      addFeedbackLine(
        "소리를 재생하지 못했어요. " +
        "파일을 확인해 주세요."
      );
    }

    await wait(450);

    if (token !== feedbackToken) return;

    /*
      2단계
      발음 특징 안내
    */

    addFeedbackLine(
      `② 소리 단서: ${question.soundHint}`,
      "hint"
    );

    await wait(650);

    if (token !== feedbackToken) return;

    /*
      3단계
      입 모양 또는 혀 위치 안내
    */

    addFeedbackLine(
      `③ ${question.mouthHint}`
    );

    await wait(650);

    if (token !== feedbackToken) return;

    /*
      4단계
      같은 보기를 다른 순서로 다시 제시
    */

    addFeedbackLine(
      "④ 보기 순서가 바뀌었어요. 다시 골라 보세요."
    );

  } else {

    /*
      5번 글 문항은 음성이 없으므로
      상황에 맞는 표현을 안내합니다.
    */

    addFeedbackLine("❌ 다시 생각해 보세요.");

    addFeedbackLine(
      question.textHint,
      "hint"
    );

    await wait(500);

    if (token !== feedbackToken) return;

    addFeedbackLine(
      "보기 순서가 바뀌었어요. 다시 골라 보세요."
    );
  }

  reorderChoices();

  locked = false;

  renderChoices();
  setControlsDisabled(false);
}


/* ========================================
   11. 다음 문제
======================================== */

function nextQuestion() {
  feedbackToken++;

  stopAudio();

  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResults();
  }
}


/* ========================================
   12. 결과 화면
======================================== */

function showResults() {
  stopAudio();

  quizScreen.style.display = "none";
  resultScreen.style.display = "block";

  document.getElementById("finalScore").textContent =
    `${score} / ${questions.length}점`;

  const resultMessage =
    document.getElementById("resultMessage");

  if (score === 5) {
    resultMessage.textContent =
      "아주 잘했어요! 한국어 소리를 잘 구별해요.";
  } else if (score >= 3) {
    resultMessage.textContent =
      "잘했어요! 어려운 소리를 조금 더 연습해 보세요.";
  } else {
    resultMessage.textContent =
      "괜찮아요! 천천히 여러 번 들으면 더 좋아질 거예요.";
  }

  const summary =
    document.getElementById("soundSummary");

  summary.replaceChildren();

  const soundTypes = ["평음", "격음", "경음"];

  soundTypes.forEach((type) => {
    const row = document.createElement("div");
    row.className = "sound-result";

    const label = document.createElement("span");
    label.textContent = type;

    const count = document.createElement("span");
    count.className = "mistake-count";
    count.textContent =
      `${soundMistakes[type]}개 틀림`;

    row.appendChild(label);
    row.appendChild(count);

    summary.appendChild(row);
  });

  const maximumMistakes = Math.max(
    ...Object.values(soundMistakes)
  );

  const summaryNote =
    document.getElementById("summaryNote");

  if (maximumMistakes === 0) {
    summaryNote.textContent =
      "👏 모든 발음 듣기 문제를 처음에 맞혔어요!";
  } else {
    const difficultTypes = soundTypes.filter(
      type => soundMistakes[type] === maximumMistakes
    );

    summaryNote.textContent =
      `더 연습할 소리: ${difficultTypes.join(", ")}. ` +
      "정답 소리를 기준으로 틀린 문제 수를 계산했어요.";
  }

  restartButton.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* ========================================
   13. 다시 하기
======================================== */

function restartQuiz() {
  feedbackToken++;

  stopAudio();

  currentQuestion = 0;
  score = 0;
  locked = false;

  missedQuestions.clear();

  soundMistakes = {
    "평음": 0,
    "격음": 0,
    "경음": 0
  };

  resultScreen.style.display = "none";
  quizScreen.style.display = "block";

  showQuestion();
}


/* ========================================
   14. 버튼 이벤트
======================================== */

listenButton.addEventListener(
  "click",
  listenToAudio
);

replayButton.addEventListener(
  "click",
  listenToAudio
);

nextButton.addEventListener(
  "click",
  nextQuestion
);

restartButton.addEventListener(
  "click",
  restartQuiz
);


/* ========================================
   15. 퀴즈 시작
======================================== */

if (!("Audio" in window)) {
  alert(
    "이 브라우저에서는 오디오를 사용할 수 없습니다."
  );
}

showQuestion();

</script>
