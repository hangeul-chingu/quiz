<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국어 발음 듣기 퀴즈 | 한국문화원 전화 연습</title>

  <script>
    // 말하기 연습 페이지 주소
    // 나중에 실제 주소를 입력하세요.
    // 주소가 비어 있으면 버튼이 표시되지 않습니다.
    const SANDBOX_URL = "";
  </script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --background: #f1f5f9;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --success: #166534;
      --success-bg: #dcfce7;
      --error: #9a3412;
      --error-bg: #ffedd5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family:
        "Noto Sans KR", "Malgun Gothic",
        "Apple SD Gothic Neo", sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.7;
      word-break: keep-all;
    }

    .container {
      max-width: 720px;
      margin: 25px auto;
      padding: 32px;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .subtitle {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 14px;
      font-weight: bold;
    }

    h1 {
      font-size: 28px;
      margin: 15px 0 8px;
      line-height: 1.4;
    }

    h2 {
      font-size: 23px;
      line-height: 1.5;
    }

    p {
      font-size: 17px;
    }

    .description {
      color: var(--muted);
      font-size: 16px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: bold;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 20px;
      transition: width 0.3s ease;
    }

    .question-number {
      color: var(--primary);
      font-weight: bold;
      font-size: 16px;
    }

    .question-text {
      margin: 10px 0 24px;
      font-size: 22px;
      font-weight: bold;
    }

    .sentence-prompt {
      padding: 24px 16px;
      margin: 15px 0 25px;
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      border-radius: 12px;
      color: var(--text);
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      line-height: 1.6;
    }

    .situation {
      padding: 20px;
      margin: 15px 0 25px;
      background: #eff6ff;
      border-left: 5px solid var(--primary);
      border-radius: 8px;
      font-size: 19px;
    }

    .audio-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0 28px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      transition: background 0.2s, transform 0.1s;
      touch-action: manipulation;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 3px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .audio-button {
      flex: 1;
      min-width: 135px;
      padding: 15px 18px;
      color: white;
      background: var(--primary);
    }

    .audio-button:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .replay-button {
      background: #475569;
    }

    .replay-button:hover:not(:disabled) {
      background: #334155;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 20px;
    }

    .choice-button {
      width: 100%;
      min-height: 70px;
      padding: 16px 20px;
      background: white;
      color: var(--text);
      border: 2px solid var(--border);
      text-align: center;
      font-size: 22px;
    }

    .choice-button:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .choice-button.correct {
      border-color: #16a34a;
      background: var(--success-bg);
      color: var(--success);
    }

    .choice-button.incorrect {
      border-color: #ea580c;
      background: var(--error-bg);
      color: var(--error);
    }

    .feedback {
      display: none;
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      font-size: 17px;
    }

    .feedback.visible {
      display: block;
    }

    .feedback.success {
      background: var(--success-bg);
      color: var(--success);
    }

    .feedback.error {
      background: var(--error-bg);
      color: var(--error);
    }

    .feedback p {
      margin: 8px 0;
    }

    .feedback strong {
      font-size: 19px;
    }

    /*
      세 소리 비교 영역
    */

    .comparison-area {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(0, 0, 0, 0.12);
    }

    .comparison-words {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 18px 0;
    }

    .comparison-word {
      min-width: 90px;
      padding: 12px 16px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      background: white;
      color: var(--text);
      font-size: 23px;
      font-weight: bold;
      text-align: center;
      transition:
        background 0.2s,
        border-color 0.2s,
        color 0.2s,
        transform 0.2s;
    }

    .comparison-word.playing {
      background: var(--primary);
      border-color: var(--primary-dark);
      color: white;
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .compare-button {
      display: block;
      width: 100%;
      padding: 16px 18px;
      margin-top: 15px;
      color: white;
      background: var(--primary);
      font-size: 18px;
    }

    .compare-button:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .retry-choice-button {
      display: block;
      width: 100%;
      padding: 16px 18px;
      margin-top: 15px;
      color: white;
      background: #475569;
      font-size: 18px;
    }

    .retry-choice-button:hover:not(:disabled) {
      background: #334155;
    }

    .next-button,
    .restart-button,
    .practice-button {
      display: none;
      width: 100%;
      padding: 18px;
      margin-top: 25px;
      color: white;
      background: var(--primary);
      font-size: 20px;
    }

    .next-button:hover,
    .restart-button:hover,
    .practice-button:hover {
      background: var(--primary-dark);
    }

    .result {
      display: none;
      text-align: center;
    }

    .score {
      font-size: 54px;
      font-weight: bold;
      color: var(--primary);
      margin: 20px 0;
    }

    .result-summary {
      margin-top: 30px;
      padding: 22px;
      background: #f8fafc;
      border-radius: 12px;
      text-align: left;
    }

    .result-summary h3 {
      margin-top: 0;
      font-size: 20px;
    }

    .sound-result {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 17px;
    }

    .sound-result:last-child {
      border-bottom: none;
    }

    .mistake-count {
      color: #c2410c;
      font-weight: bold;
    }

    .small-note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    /*
      말하기 연습 연결 영역
    */

    .speaking-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }

    .speaking-message {
      font-size: 18px;
      line-height: 1.8;
      font-weight: 600;
    }

    .practice-button {
      text-decoration: none;
      text-align: center;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 600;
    }

    footer {
      margin-top: 32px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        margin: 8px auto;
        padding: 22px 18px;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 21px;
      }

      .question-text {
        font-size: 20px;
      }

      .sentence-prompt {
        font-size: 27px;
        padding: 20px 12px;
      }

      .choice-button {
        min-height: 68px;
        font-size: 21px;
      }

      .audio-button {
        font-size: 16px;
      }

      .comparison-word {
        min-width: 75px;
        padding: 10px;
        font-size: 21px;
      }

      .compare-button,
      .retry-choice-button {
        font-size: 17px;
      }

      .score {
        font-size: 46px;
      }
    }
  </style>
</head>

<body>

<main class="container">

  <header>
    <span class="subtitle">TOPIK 2~3급 · 한국어 듣기</span>

    <h1>한국어 발음 듣기 퀴즈</h1>

    <p class="description">
      한국문화원에 전화할 때 필요한 듣기 연습
    </p>

    <p class="description">
      비슷한 소리를 듣고 알맞은 답을 골라 보세요.
    </p>
  </header>

  <!-- 퀴즈 화면 -->

  <section id="quizScreen">

    <div class="progress-info">
      <span id="progressText">문제 1 / 5</span>
      <span id="scoreText">현재 점수: 0점</span>
    </div>

    <div
      class="progress-track"
      role="progressbar"
      aria-label="퀴즈 진행률"
      aria-valuemin="0"
      aria-valuemax="5"
      aria-valuenow="0"
      id="progressTrack"
    >
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="question-number" id="questionNumber">
      문제 1
    </div>

    <h2 class="question-text" id="questionText"></h2>

    <!-- 4번 문항의 빈칸 문장 -->

    <div
      id="sentenceBox"
      class="sentence-prompt"
      hidden
    ></div>

    <!-- 5번 문항의 상황 -->

    <div
      id="situationBox"
      class="situation"
      hidden
    ></div>

    <!-- 기본 듣기 버튼 -->

    <div
      class="audio-controls"
      id="audioControls"
    >
      <button
        type="button"
        class="audio-button"
        id="listenButton"
      >
        🔊 소리 듣기
      </button>

      <button
        type="button"
        class="audio-button replay-button"
        id="replayButton"
      >
        🔁 다시 듣기
      </button>
    </div>

    <!-- 정답 보기 -->

    <div
      class="choices"
      id="choices"
      role="group"
      aria-label="정답 선택"
    ></div>

    <!-- 오답 및 정답 피드백 -->

    <div
      class="feedback"
      id="feedback"
      role="status"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <button
      type="button"
      class="next-button"
      id="nextButton"
    >
      다음 문제 →
    </button>

  </section>

  <!-- 결과 화면 -->

  <section
    class="result"
    id="resultScreen"
    aria-labelledby="resultTitle"
  >

    <h2 id="resultTitle">
      🎉 연습이 끝났어요!
    </h2>

    <p>
      잘했어요! 나의 점수를 확인해 보세요.
    </p>

    <div class="score" id="finalScore"></div>

    <p id="resultMessage"></p>

    <div class="result-summary">

      <h3>📊 나의 발음 듣기 결과</h3>

      <p>
        어떤 소리를 더 연습하면 좋을까요?
      </p>

      <div id="soundSummary"></div>

      <p
        class="small-note"
        id="summaryNote"
      ></p>

    </div>

    <!-- 말하기 연습 안내 -->

    <div class="speaking-section">

      <p class="speaking-message">
        틀린 소리는 따라 말하며 연습해 보세요.
        다음 활동: 말하기 연습
      </p>

      <a
        id="speakingLink"
        class="practice-button"
        href=""
        hidden
      >
        말하기 연습으로 가기 →
      </a>

    </div>

    <button
      type="button"
      class="restart-button"
      id="restartButton"
    >
      🔄 다시 하기
    </button>

  </section>

  <footer>
    한국어 발음 구별 연습 · 평음 / 격음 / 경음
    <br>
    첫 번째 선택을 기준으로 점수를 계산합니다.
  </footer>

</main>


<script>
"use strict";

/* ========================================
   1. 퀴즈 데이터
======================================== */

const questions = [
  {
    id: 1,
    type: "audio",
    text: "소리를 듣고 알맞은 단어를 고르세요.",

    audio: "audio/q1_ppul.mp3",

    choices: ["불", "뿔", "풀"],

    answer: "뿔",
    soundType: "경음",

    comparison: [
      {
        word: "불",
        audio: "audio/q1_bul.mp3"
      },
      {
        word: "뿔",
        audio: "audio/q1_ppul.mp3"
      },
      {
        word: "풀",
        audio: "audio/q1_pul.mp3"
      }
    ]
  },

  {
    id: 2,
    type: "audio",
    text: "소리를 듣고 알맞은 단어를 고르세요.",

    audio: "audio/q2_ja.mp3",

    choices: ["자다", "짜다", "차다"],

    answer: "자다",
    soundType: "평음",

    comparison: [
      {
        word: "자다",
        audio: "audio/q2_ja.mp3"
      },
      {
        word: "짜다",
        audio: "audio/q2_jja.mp3"
      },
      {
        word: "차다",
        audio: "audio/q2_cha.mp3"
      }
    ]
  },

  {
    id: 3,
    type: "audio",
    text: "소리를 듣고 알맞은 단어를 고르세요.",

    audio: "audio/q3_tal.mp3",

    choices: ["달", "딸", "탈"],

    answer: "탈",
    soundType: "격음",

    comparison: [
      {
        word: "달",
        audio: "audio/q3_dal.mp3"
      },
      {
        word: "딸",
        audio: "audio/q3_ttal.mp3"
      },
      {
        word: "탈",
        audio: "audio/q3_tal.mp3"
      }
    ]
  },

  {
    id: 4,
    type: "audio",

    text: "문장에서 들은 단어를 고르세요.",

    displaySentence: "저기 (   )이 있어요.",

    audio: "audio/q4_sentence.mp3",

    choices: ["달", "딸", "탈"],

    answer: "딸",
    soundType: "경음",

    comparison: [
      {
        word: "달",
        audio: "audio/q3_dal.mp3"
      },
      {
        word: "딸",
        audio: "audio/q3_ttal.mp3"
      },
      {
        word: "탈",
        audio: "audio/q3_tal.mp3"
      }
    ]
  },

  {
    id: 5,
    type: "text",

    text: "이럴 때 어떤 말을 하면 좋을까요?",

    situation:
      "인턴십 문의 전화에서 상대방 말이 잘 안 들렸어요.",

    choices: [
      "다시 한번 말씀해 주시겠어요?",
      "다시 한번 보여 주시겠어요?",
      "조금 더 빨리 말씀해 주시겠어요?"
    ],

    answer: "다시 한번 말씀해 주시겠어요?",

    soundType: null,

    textHint:
      "전화에서는 상대방에게 다시 말해 달라고 정중하게 부탁해요."
  }
];


/* ========================================
   2. 상태 변수
======================================== */

let currentQuestion = 0;

let score = 0;

let locked = false;

let currentChoices = [];

let currentAudio = null;

let feedbackToken = 0;

const missedQuestions = new Set();

let soundMistakes = {
  "평음": 0,
  "격음": 0,
  "경음": 0
};


/* ========================================
   3. HTML 요소
======================================== */

const quizScreen =
  document.getElementById("quizScreen");

const resultScreen =
  document.getElementById("resultScreen");

const progressText =
  document.getElementById("progressText");

const scoreText =
  document.getElementById("scoreText");

const progressFill =
  document.getElementById("progressFill");

const progressTrack =
  document.getElementById("progressTrack");

const questionNumber =
  document.getElementById("questionNumber");

const questionText =
  document.getElementById("questionText");

const sentenceBox =
  document.getElementById("sentenceBox");

const situationBox =
  document.getElementById("situationBox");

const audioControls =
  document.getElementById("audioControls");

const listenButton =
  document.getElementById("listenButton");

const replayButton =
  document.getElementById("replayButton");

const choicesContainer =
  document.getElementById("choices");

const feedback =
  document.getElementById("feedback");

const nextButton =
  document.getElementById("nextButton");

const restartButton =
  document.getElementById("restartButton");

const speakingLink =
  document.getElementById("speakingLink");


/* ========================================
   4. 오디오 관리
======================================== */

/*
  재생 중인 음성을 중지합니다.
  중단된 재생의 Promise도 완료 처리합니다.
*/

function stopAudio() {
  if (!currentAudio) return;

  const active = currentAudio;

  currentAudio = null;

  active.audio.pause();

  try {
    active.audio.currentTime = 0;
  } catch (error) {
    // 로드되지 않은 파일일 수 있습니다.
  }

  active.finish(false);
}


/*
  지정한 상대 경로의 오디오를 재생합니다.

  rate = 1    : 기본 속도
  rate = 0.75 : 느린 속도

  성공 또는 실패 시 Promise가 완료됩니다.
*/

function playAudioFile(filePath, rate = 1) {
  stopAudio();

  return new Promise((resolve) => {

    const audio = new Audio(filePath);

    audio.preload = "auto";
    audio.playbackRate = rate;
    audio.volume = 1;

    if ("preservesPitch" in audio) {
      audio.preservesPitch = true;
    }

    let finished = false;

    const active = {
      audio: audio,
      finish: finish
    };

    function finish(success) {
      if (finished) return;

      finished = true;

      if (currentAudio === active) {
        currentAudio = null;
      }

      resolve(success);
    }

    currentAudio = active;

    audio.addEventListener(
      "ended",
      () => finish(true),
      { once: true }
    );

    audio.addEventListener(
      "error",
      () => finish(false),
      { once: true }
    );

    try {
      const playPromise = audio.play();

      if (playPromise) {
        playPromise.catch(() => finish(false));
      }

    } catch (error) {
      finish(false);
    }
  });
}


/*
  현재 문제의 기본 음성을 재생합니다.
*/

function playQuestionAudio(rate = 1) {
  const question = questions[currentQuestion];

  if (!question.audio) {
    return Promise.resolve(false);
  }

  return playAudioFile(question.audio, rate);
}


/*
  소리 듣기 / 다시 듣기
*/

function listenToAudio() {
  if (locked) return;

  const questionIndex = currentQuestion;

  playQuestionAudio(1).then((success) => {

    if (
      !success &&
      questionIndex === currentQuestion &&
      !locked
    ) {
      showAudioError();
    }

  });
}

function showAudioError() {
  feedback.className = "feedback visible error";
  feedback.replaceChildren();

  addFeedbackLine(
    "소리 파일을 재생할 수 없어요. " +
    "audio 폴더와 파일 이름을 확인해 주세요."
  );
}


/* ========================================
   5. 화면 표시
======================================== */

function showQuestion() {
  feedbackToken++;

  stopAudio();

  locked = false;

  const question = questions[currentQuestion];

  currentChoices = [...question.choices];

  questionNumber.textContent =
    `문제 ${currentQuestion + 1}`;

  progressText.textContent =
    `문제 ${currentQuestion + 1} / ${questions.length}`;

  scoreText.textContent =
    `현재 점수: ${score}점`;

  progressFill.style.width =
    `${(currentQuestion / questions.length) * 100}%`;

  progressTrack.setAttribute(
    "aria-valuenow",
    currentQuestion
  );

  questionText.textContent = question.text;

  /*
    4번 문항의 빈칸 문장
  */

  if (question.displaySentence) {
    sentenceBox.textContent =
      question.displaySentence;

    sentenceBox.hidden = false;

  } else {
    sentenceBox.textContent = "";
    sentenceBox.hidden = true;
  }

  feedback.className = "feedback";
  feedback.replaceChildren();

  nextButton.style.display = "none";

  if (question.type === "audio") {
    audioControls.hidden = false;
    situationBox.hidden = true;

  } else {
    audioControls.hidden = true;
    situationBox.hidden = false;
    situationBox.textContent = question.situation;
  }

  setControlsDisabled(false);

  renderChoices();

  questionNumber.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}


/* ========================================
   6. 보기 생성
======================================== */

function renderChoices() {
  choicesContainer.replaceChildren();

  currentChoices.forEach((choice, index) => {

    const button = document.createElement("button");

    button.type = "button";
    button.className = "choice-button";

    button.textContent =
      `${index + 1}. ${choice}`;

    button.disabled = locked;

    button.addEventListener("click", () => {
      checkAnswer(choice, button);
    });

    choicesContainer.appendChild(button);
  });
}

function setControlsDisabled(disabled) {
  listenButton.disabled = disabled;
  replayButton.disabled = disabled;

  const buttons =
    choicesContainer.querySelectorAll("button");

  buttons.forEach((button) => {
    button.disabled = disabled;
  });
}


/* ========================================
   7. 공통 기능
======================================== */

function addFeedbackLine(text) {
  const paragraph = document.createElement("p");

  paragraph.textContent = text;

  feedback.appendChild(paragraph);

  return paragraph;
}

function wait(milliseconds) {
  return new Promise((resolve) => {
    setTimeout(resolve, milliseconds);
  });
}


/*
  오답 후 보기 순서를 바꿉니다.
*/

function reorderChoices() {
  if (currentChoices.length > 1) {
    const firstChoice = currentChoices.shift();
    currentChoices.push(firstChoice);
  }
}


/* ========================================
   8. 정답 확인
======================================== */

function checkAnswer(selected, selectedButton) {
  if (locked) return;

  const question = questions[currentQuestion];

  if (selected === question.answer) {
    handleCorrectAnswer(selectedButton);
  } else {
    handleWrongAnswer(selectedButton);
  }
}


/* ========================================
   9. 정답 처리
======================================== */

function handleCorrectAnswer(selectedButton) {
  locked = true;

  stopAudio();
  setControlsDisabled(true);

  const question = questions[currentQuestion];

  /*
    첫 번째 선택에서 맞힌 경우만 점수를 줍니다.
    오답 후 다시 맞혀도 점수는 올라가지 않습니다.
  */

  if (!missedQuestions.has(currentQuestion)) {
    score++;
  }

  selectedButton.classList.add("correct");

  scoreText.textContent =
    `현재 점수: ${score}점`;

  feedback.className = "feedback visible success";
  feedback.replaceChildren();

  addFeedbackLine(
    `✅ 정답이에요! "${question.answer}"`
  );

  if (question.soundType) {
    addFeedbackLine(
      `이 소리는 ${question.soundType}이에요.`
    );

  } else {
    addFeedbackLine(
      "상대방에게 다시 말해 달라고 정중하게 부탁하는 표현이에요."
    );
  }

  if (currentQuestion === questions.length - 1) {
    nextButton.textContent = "결과 보기 →";
  } else {
    nextButton.textContent = "다음 문제 →";
  }

  nextButton.style.display = "block";
}


/* ========================================
   10. 오답 처리
======================================== */

async function handleWrongAnswer(selectedButton) {
  locked = true;

  const questionIndex = currentQuestion;
  const question = questions[questionIndex];

  const token = ++feedbackToken;

  stopAudio();
  setControlsDisabled(true);

  selectedButton.classList.add("incorrect");

  /*
    한 문항에서 여러 번 틀려도
    소리 유형별 오류는 한 번만 기록합니다.
  */

  if (!missedQuestions.has(questionIndex)) {
    missedQuestions.add(questionIndex);

    if (question.soundType) {
      soundMistakes[question.soundType]++;
    }
  }

  feedback.className = "feedback visible error";
  feedback.replaceChildren();

  if (question.type === "audio") {

    /*
      1단계:
      같은 소리를 0.75배속으로 한 번 재생합니다.

      정답이나 발음 설명은 표시하지 않습니다.
    */

    addFeedbackLine(
      "천천히 다시 들어 보세요."
    );

    await playQuestionAudio(0.75);

    if (token !== feedbackToken) return;

    /*
      2단계:
      세 소리 비교 안내와 버튼을 표시합니다.
    */

    showComparisonControls(question, token);

  } else {

    /*
      5번 글 문항:
      기존의 상황 표현 피드백을 유지합니다.
    */

    addFeedbackLine("❌ 다시 생각해 보세요.");

    addFeedbackLine(question.textHint);

    await wait(500);

    if (token !== feedbackToken) return;

    addFeedbackLine(
      "보기 순서가 바뀌었어요. 다시 골라 보세요."
    );

    reorderChoices();

    locked = false;

    renderChoices();
    setControlsDisabled(false);
  }
}


/* ========================================
   11. 세 소리 비교 영역
======================================== */

function showComparisonControls(question, token) {

  const comparisonArea = document.createElement("div");

  comparisonArea.className = "comparison-area";

  /*
    안내 문장은 요청한 문장만 사용합니다.
  */

  const instruction = document.createElement("p");

  instruction.textContent =
    "세 소리를 비교해 들어 보세요.";

  comparisonArea.appendChild(instruction);

  /*
    세 단어 표시 영역
  */

  const wordsContainer = document.createElement("div");

  wordsContainer.className = "comparison-words";

  wordsContainer.setAttribute(
    "aria-label",
    "비교할 세 단어"
  );

  const wordElements = [];

  question.comparison.forEach((item) => {

    const wordElement = document.createElement("span");

    wordElement.className = "comparison-word";

    wordElement.textContent = item.word;

    wordsContainer.appendChild(wordElement);

    wordElements.push(wordElement);
  });

  comparisonArea.appendChild(wordsContainer);

  /*
    세 소리 차례로 듣기 버튼
  */

  const compareButton = document.createElement("button");

  compareButton.type = "button";
  compareButton.className = "compare-button";

  compareButton.textContent =
    "🔊 세 소리 차례로 듣기";

  comparisonArea.appendChild(compareButton);

  /*
    다시 선택하기 버튼

    세 소리를 한 번 비교해서 들은 후
    표시됩니다.
  */

  const retryButton = document.createElement("button");

  retryButton.type = "button";
  retryButton.className = "retry-choice-button";

  retryButton.textContent = "다시 선택하기";

  retryButton.hidden = true;

  comparisonArea.appendChild(retryButton);

  /*
    비교 듣기 버튼 이벤트
  */

  compareButton.addEventListener("click", async () => {

    if (token !== feedbackToken) return;

    compareButton.disabled = true;
    retryButton.hidden = true;

    await playComparisonAudio(
      question.comparison,
      wordElements,
      token
    );

    if (token !== feedbackToken) return;

    compareButton.disabled = false;

    /*
      비교 재생이 끝난 후
      다시 선택하기 버튼을 표시합니다.
    */

    retryButton.hidden = false;
  });

  /*
    다시 선택하기 버튼 이벤트
  */

  retryButton.addEventListener("click", () => {

    if (token !== feedbackToken) return;

    retryQuestion();
  });

  feedback.appendChild(comparisonArea);
}


/* ========================================
   12. 세 소리 순서대로 재생
======================================== */

/*
  세 소리를 지정한 순서로 재생합니다.

  - 각 단어는 원래 속도(1배속)로 재생
  - 재생 중인 단어 강조
  - 단어 사이 약 0.8초 간격
  - 정답 표시 없음
*/

async function playComparisonAudio(
  comparison,
  wordElements,
  token
) {

  /*
    강조 표시 초기화
  */

  wordElements.forEach((element) => {
    element.classList.remove("playing");
    element.removeAttribute("aria-current");
  });

  /*
    세 소리 순차 재생
  */

  for (let i = 0; i < comparison.length; i++) {

    if (token !== feedbackToken) return;

    /*
      이전 단어의 강조 해제
    */

    wordElements.forEach((element) => {
      element.classList.remove("playing");
      element.removeAttribute("aria-current");
    });

    /*
      현재 재생 단어 강조
    */

    const currentWord = wordElements[i];

    currentWord.classList.add("playing");

    currentWord.setAttribute(
      "aria-current",
      "true"
    );

    /*
      해당 단어의 음성 파일 재생
    */

    await playAudioFile(
      comparison[i].audio,
      1
    );

    if (token !== feedbackToken) return;

    /*
      재생 완료 후 강조 해제
    */

    currentWord.classList.remove("playing");
    currentWord.removeAttribute("aria-current");

    /*
      마지막 단어가 아니면
      다음 단어까지 800ms 대기
    */

    if (i < comparison.length - 1) {
      await wait(800);
    }
  }

  /*
    모든 재생이 끝나면 강조 표시를 초기화합니다.
  */

  wordElements.forEach((element) => {
    element.classList.remove("playing");
    element.removeAttribute("aria-current");
  });
}


/* ========================================
   13. 다시 선택하기
======================================== */

function retryQuestion() {

  /*
    이전 피드백 작업 무효화
  */

  feedbackToken++;

  stopAudio();

  /*
    보기 순서를 변경합니다.
    정답은 변경하지 않습니다.
  */

  reorderChoices();

  /*
    오답 피드백을 닫습니다.
  */

  feedback.className = "feedback";
  feedback.replaceChildren();

  /*
    선택 기능을 다시 활성화합니다.
  */

  locked = false;

  renderChoices();
  setControlsDisabled(false);

  /*
    보기 영역으로 이동합니다.
  */

  choicesContainer.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}


/* ========================================
   14. 다음 문제
======================================== */

function nextQuestion() {
  feedbackToken++;

  stopAudio();

  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResults();
  }
}


/* ========================================
   15. 결과 화면
======================================== */

function showResults() {
  stopAudio();

  quizScreen.style.display = "none";
  resultScreen.style.display = "block";

  document.getElementById("finalScore").textContent =
    `${score} / ${questions.length}점`;

  const resultMessage =
    document.getElementById("resultMessage");

  if (score === 5) {
    resultMessage.textContent =
      "아주 잘했어요! 한국어 소리를 잘 구별해요.";

  } else if (score >= 3) {
    resultMessage.textContent =
      "잘했어요! 어려운 소리를 조금 더 연습해 보세요.";

  } else {
    resultMessage.textContent =
      "괜찮아요! 천천히 여러 번 들으면 더 좋아질 거예요.";
  }

  /*
    평음 / 격음 / 경음 오류 요약
    기존 점수 계산 방식을 유지합니다.
  */

  const summary =
    document.getElementById("soundSummary");

  summary.replaceChildren();

  const soundTypes = [
    "평음",
    "격음",
    "경음"
  ];

  soundTypes.forEach((type) => {

    const row = document.createElement("div");
    row.className = "sound-result";

    const label = document.createElement("span");
    label.textContent = type;

    const count = document.createElement("span");
    count.className = "mistake-count";

    count.textContent =
      `${soundMistakes[type]}개 틀림`;

    row.appendChild(label);
    row.appendChild(count);

    summary.appendChild(row);
  });

  const maximumMistakes = Math.max(
    ...Object.values(soundMistakes)
  );

  const summaryNote =
    document.getElementById("summaryNote");

  if (maximumMistakes === 0) {

    summaryNote.textContent =
      "👏 모든 발음 듣기 문제를 처음에 맞혔어요!";

  } else {

    const difficultTypes = soundTypes.filter(
      type => soundMistakes[type] === maximumMistakes
    );

    summaryNote.textContent =
      `더 연습할 소리: ${difficultTypes.join(", ")}. ` +
      "정답 소리를 기준으로 틀린 문제 수를 계산했어요.";
  }

  /*
    말하기 연습 링크 설정

    SANDBOX_URL에 주소가 있는 경우만
    링크 버튼을 표시합니다.
  */

  configureSpeakingLink();

  restartButton.style.display = "block";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* ========================================
   16. 말하기 연습 링크
======================================== */

function configureSpeakingLink() {

  const url = SANDBOX_URL.trim();

  if (url !== "") {

    speakingLink.href = url;

    speakingLink.hidden = false;

    speakingLink.style.display = "block";

  } else {

    speakingLink.removeAttribute("href");

    speakingLink.hidden = true;

    speakingLink.style.display = "none";
  }
}


/* ========================================
   17. 다시 하기
======================================== */

function restartQuiz() {
  feedbackToken++;

  stopAudio();

  currentQuestion = 0;
  score = 0;
  locked = false;

  missedQuestions.clear();

  soundMistakes = {
    "평음": 0,
    "격음": 0,
    "경음": 0
  };

  resultScreen.style.display = "none";
  quizScreen.style.display = "block";

  showQuestion();
}


/* ========================================
   18. 버튼 이벤트
======================================== */

listenButton.addEventListener(
  "click",
  listenToAudio
);

replayButton.addEventListener(
  "click",
  listenToAudio
);

nextButton.addEventListener(
  "click",
  nextQuestion
);

restartButton.addEventListener(
  "click",
  restartQuiz
);


/* ========================================
   19. 퀴즈 시작
======================================== */

if (!("Audio" in window)) {
  alert(
    "이 브라우저에서는 오디오를 사용할 수 없습니다."
  );
}

showQuestion();

</script>
